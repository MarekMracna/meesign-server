name: Rust

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install latest stable
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: rustfmt, clippy
      - name: Install protoc
        uses: arduino/setup-protoc@v1
        with:
          version: 3.x

      - name: Build
        run: cargo build --verbose

      - name: Run only unit tests
        run: cargo test --verbose

      - name: Run also database tests
        run: cargo test --verbose --features db-tests

      - name: Run integration tests
        run: ./run_integration_tests.sh

  code-coverage:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - name: Install latest stable
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: rustfmt, clippy, llvm-tools-preview
      - name: Install protoc
        uses: arduino/setup-protoc@v1
        with:
          version: 3.x
      - name: Install code coverage report generator
        run: |
          sudo apt-get update && sudo apt-get install -y lcov jq
      - name: Install rust demangler
        uses: actions-rs/install@v0.1
        with:
          crate: rustfilt
          version: latest
          use-tool-cache: true
      - name: Add LLVM tools (llvm-cov and llvm-profdata) to PATH
        run: echo "$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | grep host | cut -d' ' -f2)/bin" >> $GITHUB_PATH

      - name: Run coverage script
        run: ./generate_codecov.sh

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: ./coverage
          if-no-files-found: error

  build-n-release-docker-main:
    needs: build
    name: Docker main
    if: github.ref == 'refs/heads/main' && github.repository_owner == 'crocs-muni'
    uses: ./.github/workflows/docker.yml
    secrets: inherit
    with:
      dockerhub_username: crocsmuni
      project_name: meesign
      docker_tags: |
        crocsmuni/meesign:main

  build-n-release-docker-stable:
    needs: build
    name: Docker stable
    # only tagged versions
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    uses: ./.github/workflows/docker.yml
    secrets: inherit
    with:
      dockerhub_username: crocsmuni
      project_name: meesign
      docker_tags: |
        crocsmuni/meesign:latest
