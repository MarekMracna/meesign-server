name: meesing-integration-tests

services:
  db:
    env_file: ./integration-tests/.env
    networks:
      - test-meesign-network

  meesign-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENABLE_COVERAGE: 1
    env_file: ./integration-tests/.env
    environment:
      - LLVM_PROFILE_FILE=/coverage/e2e_test_%p_%m.profraw
    stop_signal: SIGTERM
    networks:
      - test-meesign-network
    volumes:
      - ./integration-tests/keys:/meesign/keys:ro
      - ./coverage:/coverage:rw
    healthcheck:
      # TODO The healthcheck performance is dependent on the lifetime of the
      #      application. With more devices it could get slower.
      test: [ "CMD-SHELL", "LLVM_PROFILE_FILE=/dev/null meesign-server get-devices"]
      interval: 1s
      timeout: 5s
      retries: 10

  test-client:
    build:
      args:
        # TODO Test against crocs-muni `main` branch
        # TODO Allow testing against a particular commit or a tag
        MEESIGN_TEST_CLIENT_REPO_OWNER: crocs-muni
        MEESIGN_TEST_CLIENT_REPO_BRANCH: devel
      dockerfile: ./integration-tests/Dockerfile.test_client
    networks:
      # This network is defined in the /docker-compose.dev.yaml
      - test-meesign-network
    volumes:
      # This might not work - the failed tests output shall be saved to test/output/*.
      # This attempts to make theses outputs then available for local inspection.
      - ./integration-tests/output:/meesign-client/meesign-core/test/output
    depends_on:
      meesign-server:
        condition: service_healthy

networks:
  test-meesign-network:
    name: test-meesign-network
    driver: bridge
